modifier_types:
  - id: race
    label: 种族
    stack_rule: exclusive
    base_priority: 200

  - id: class
    label: 职业
    stack_rule: exclusive
    base_priority: 180

  - id: subclass
    label: 子职业
    stack_rule: exclusive
    base_priority: 160

  - id: level
    label: 等级成长
    stack_rule: exclusive
    base_priority: 90

  - id: equipment
    label: 装备
    stack_rule: additive
    base_priority: 50

  - id: buff
    label: 增益/减益
    stack_rule: independent
    base_priority: 10

  - id: passive
    label: 被动
    stack_rule: additive
    # 本期属性被动早于 derived(300)。若未来 class/race 出现 set 语义覆盖基础属性,再调整优先级。
    base_priority: 70

  - id: derived
    label: 派生属性
    stack_rule: exclusive
    base_priority: 300        # 高于 race(200) → ModifierChain 升序应用时最后跑,读到累加后的基础属性
