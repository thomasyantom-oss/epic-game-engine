id: poison_dart
name: "毒镖"
description: "毒镖，命中目标并附加中毒状态"
category: skill
silenceable: true
effect: damage_with_debuff
damage:
  base: attack
  scaling: { 敏捷: 0.1 }
targeting:
  mode: pattern
  field: enemy
  pattern: [[0,0]]
  steps:
    - prompt: "选择目标"
      filter: enemy
      count: 1
debuff:
  id: poison
  scaling: { damage: { 敏捷: 0.1 } }
  data:
    damage: 3
    remaining: 3
    stacking: stack
    maxStacks: 5
    color: "#9c27b0"
    permanent: false
    positive: false
log:
  template: "{caster} 的毒镖命中 {target}，造成 {damage} 点伤害并中毒"
# 毒镖是数据驱动技能(effect: damage_with_debuff),动画由 present()→resolveAnimation 读取本块生成。
# 缺这块就既无飞射动画也无伤害数字(damage_number 是动画原语)。参照 fireball 的飞射→命中→抖动→数字结构。
animation:
  - type: projectile
    shape: diamond
    color: "#9c27b0"
    trail: glow
    speed: fast
    from: actor
    to: target
  - type: impact
    target: target
    color: "#9c27b0"
  - type: shake
    target: target
    intensity: normal
  - type: damage_number
    target: target
    color: damage
  - type: debuff_down
    target: target
    color: "#9c27b0"
