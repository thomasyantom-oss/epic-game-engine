id: poison_dart
name: "毒镖"
description: "毒镖，命中目标并附加中毒状态"
category: skill
silenceable: true
effect: damage_with_debuff
damage:
  base: attack
  scaling: { 敏捷: 0.1 }
targeting:
  mode: pattern
  field: enemy
  pattern: [[0,0]]
  steps:
    - prompt: "选择目标"
      filter: enemy
      count: 1
debuff:
  id: poison
  scaling: { damage: { 敏捷: 0.1 } }
  data:
    damage: 3
    remaining: 3
    stacking: stack
    maxStacks: 5
    color: "#9c27b0"
    permanent: false
    positive: false
log:
  template: "{caster} 的毒镖命中 {target}，造成 {damage} 点伤害并中毒"
