id: light_field
name: "光击阵"
description: "光击阵，在指定区域布置光能陷阱"
category: skill
tier: smooth
silenceable: true
effect: damage_only
damage:
  type: 法术
  add: 15
  scaling: { 智力: 0.1 }
level_scaling:
  "damage.add": 7
targeting:
  mode: pattern
  field: enemy
  pattern: [[0,0],[-1,0],[1,0],[0,-1],[0,1]]
  aoe_offsets: [[0,0],[-1,0],[1,0],[0,-1],[0,1]]   # frontend range hint (actions.js)
  allow_empty: true                                 # light field can target empty cells
  steps:
    - prompt: "选择落点"
      filter: any
      count: 1
animation:
  - type: impact
    target: each
    color: "#ffee58"
  - type: shake
    target: each
    intensity: normal
  - type: damage_number
    target: each
    color: damage
    value: "@damage"
log:
  per_target: "{caster} 对 {target} 造成 {damage} 点伤害"
