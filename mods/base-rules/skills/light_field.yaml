id: light_field
name: "光击阵"
description: "光击阵，在指定区域布置光能陷阱"
category: skill
silenceable: true
targeting:
  aoe_offsets: [[0,0],[-1,0],[1,0],[0,-1],[0,1]]
  allow_empty: true
  steps:
    - prompt: "选择落点"
      filter: any
      count: 1
animation:
  - type: flash_sequence
    target: target
  - type: impact
    target: target
    color: "#ffee58"
  - type: shake
    target: target
    intensity: normal
  - type: damage_number
    target: target
    color: damage
