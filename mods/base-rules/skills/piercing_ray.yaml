id: piercing_ray
name: "贯穿射线"
description: "贯穿射线，穿透目标列造成伤害"
category: skill
silenceable: true
damage:
  base: attack
  add: 6
targeting:
  mode: pattern
  field: enemy
  pattern: [[0,0],[-1,0],[1,0],[-2,0],[2,0]]
  aoe_offsets: [[0,-2],[0,-1],[0,0],[0,1],[0,2]]   # frontend range hint (actions.js)
  steps:
    - prompt: "选择一行中的任意目标"
      filter: enemy
      count: 1
# NOTE: piercing_ray is a bespoke skill (piercing_ray.js builds + emits its animation directly).
# This block is decorative/reference only — it is NOT read at runtime. Edit piercing_ray.js to change the animation.
animation:
  - type: beam
    from: slot_line_start
    to: slot_line_end
    color: "#81d4fa"
  - type: impact
    target: each
    color: "#81d4fa"
  - type: shake
    target: each
    intensity: normal
  - type: damage_number
    target: each
    color: damage
