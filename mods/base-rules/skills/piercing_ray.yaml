id: piercing_ray
name: "贯穿射线"
description: "贯穿射线，穿透目标列造成伤害"
category: skill
silenceable: true
damage:
  base: attack
  add: 6
targeting:
  mode: pattern
  field: enemy
  pattern: [[0,0],[-1,0],[1,0],[-2,0],[2,0]]
  steps:
    - prompt: "选择一行中的任意目标"
      filter: enemy
      count: 1
animation:
  - type: beam
    from: slot_line_start
    to: slot_line_end
    color: "#81d4fa"
  - type: impact
    target: each
    color: "#81d4fa"
  - type: shake
    target: each
    intensity: normal
  - type: damage_number
    target: each
    color: damage
