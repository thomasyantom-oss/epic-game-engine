id: piercing_ray
name: "贯穿射线"
category: skill
silenceable: true
targeting:
  aoe_offsets: [[0,-2],[0,-1],[0,0],[0,1],[0,2]]
  allow_empty: true
  steps:
    - prompt: "选择一行中的任意目标"
      filter: enemy
      count: 1
animation:
  - type: beam
    from: actor
    to: target
    color: "#81d4fa"
  - type: impact
    target: target
    color: "#81d4fa"
  - type: shake
    target: target
    intensity: normal
  - type: damage_number
    target: target
    color: damage
