id: cleave
name: "顺劈斩"
description: "顺劈斩，横扫前排多个目标"
category: skill
silenceable: true
damage:
  base: attack
  scaling: { 力量: 0.1 }
targeting:
  mode: pattern
  field: enemy
  pattern: [[0,0],[0,-1],[0,1],[0,-2],[0,2]]
  aoe_offsets: [[-2,0],[-1,0],[0,0],[1,0],[2,0]]   # frontend range hint (actions.js)
  steps:
    - prompt: "选择一排中的任意目标"
      filter: enemy
      count: 1
# NOTE: cleave is a bespoke skill (cleave.js builds + emits its animation directly).
# This block is decorative/reference only — it is NOT read at runtime. Edit cleave.js to change the animation.
animation:
  - type: lunge
    target: actor
    side: actor_side
  - type: slash
    area: column
    color: "#ffffff"
  - type: shake
    target: each
    intensity: heavy
  - type: damage_number
    target: each
    color: damage
