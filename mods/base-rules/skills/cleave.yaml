id: cleave
name: "顺劈斩"
category: skill
silenceable: true
targeting:
  highlight: row
  steps:
    - prompt: "选择一排中的任意目标"
      filter: enemy
      count: 1
animation:
  - type: lunge
    target: actor
    side: actor_side
  - type: slash
    target: target
    color: "#ffffff"
  - type: shake
    target: target
    intensity: heavy
  - type: damage_number
    target: target
    color: damage
