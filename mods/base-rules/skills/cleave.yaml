id: cleave
name: "顺劈斩"
description: "顺劈斩，横扫前排多个目标"
category: skill
silenceable: true
damage:
  base: attack
  add: 5
targeting:
  mode: pattern
  field: enemy
  pattern: [[0,0],[0,-1],[0,1],[0,-2],[0,2]]
  steps:
    - prompt: "选择一排中的任意目标"
      filter: enemy
      count: 1
animation:
  - type: lunge
    target: actor
    side: actor_side
  - type: slash
    area: column
    color: "#ffffff"
  - type: shake
    target: each
    intensity: heavy
  - type: damage_number
    target: each
    color: damage
