id: cleave
name: "顺劈斩"
category: skill
silenceable: true
targeting:
  aoe_offsets: [[-2,0],[-1,0],[0,0],[1,0],[2,0]]
  allow_empty: true
  steps:
    - prompt: "选择一排中的任意目标"
      filter: enemy
      count: 1
animation:
  - type: lunge
    target: actor
    side: actor_side
  - type: slash
    area: all
    color: "#ffffff"
  - type: shake
    target: target
    intensity: heavy
  - type: damage_number
    target: target
    color: damage
