id: crescent_slash
name: "月牙斩"
category: skill
silenceable: true
targeting:
  steps:
    - prompt: "选择目标"
      filter: enemy
      count: 1
animation:
  - type: lunge
    target: actor
    side: actor_side
  - type: slash
    target: target
    color: "#ffffff"
  - type: shake
    target: target
    intensity: heavy
  - type: damage_number
    target: target
    color: damage
