id: crescent_slash
name: "月牙斩"
description: "月牙斩，对目标造成大范围物理伤害"
category: skill
silenceable: true
effect: damage_only
damage:
  base: attack
  add: 12
targeting:
  mode: pattern
  field: enemy
  pattern: [[0,0]]
  steps:
    - prompt: "选择目标"
      filter: enemy
      count: 1
animation:
  - type: lunge
    target: actor
    side: actor_side
  - type: slash
    target: target
    color: "#ffffff"
  - type: shake
    target: target
    intensity: heavy
  - type: damage_number
    target: target
    color: damage
