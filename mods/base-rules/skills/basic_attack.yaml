id: basic_attack
name: "攻击"
description: "对目标造成 100% 物理伤害"
category: action
silenceable: true
effect: damage_only
damage:
  via_damage_calc: true
targeting:
  mode: pattern
  field: enemy
  pattern: [[0,0]]
  steps:
    - prompt: "选择目标"
      filter: enemy
      count: 1
animation:
  - type: lunge
    target: actor
    side: actor_side
  - type: impact
    target: target
  - type: shake
    target: target
    intensity: normal
  - type: damage_number
    target: target
    color: damage
