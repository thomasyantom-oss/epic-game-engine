id: pulse_wave
name: "震波"
description: "震波，对目标造成冲击伤害"
category: skill
silenceable: true
effect: damage_only
damage:
  base: attack
  scaling: { 体质: 0.1 }
targeting:
  mode: pattern
  field: enemy
  pattern: [[0,0]]
  steps:
    - prompt: "选择目标"
      filter: enemy
      count: 1
animation:
  - type: pulse
    target: actor
    color: "#ce93d8"
  - type: impact
    target: target
    color: "#ce93d8"
  - type: shake
    target: target
    intensity: normal
  - type: damage_number
    target: target
    color: damage
