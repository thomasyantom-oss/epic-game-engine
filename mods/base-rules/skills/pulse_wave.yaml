id: pulse_wave
name: "脉冲波"
description: "脉冲波，对范围内敌人造成伤害"
category: skill
silenceable: true
effect: damage_only
damage:
  base: attack
  add: 6
targeting:
  mode: pattern
  field: enemy
  pattern: [[0,0]]
  steps:
    - prompt: "选择目标"
      filter: enemy
      count: 1
animation:
  - type: pulse
    target: actor
    color: "#ce93d8"
  - type: impact
    target: target
    color: "#ce93d8"
  - type: shake
    target: target
    intensity: normal
  - type: damage_number
    target: target
    color: damage
