id: pulse_wave
name: "脉冲波"
category: skill
silenceable: true
targeting:
  steps:
    - prompt: "选择目标"
      filter: enemy
      count: 1
animation:
  - type: pulse
    target: actor
    color: "#ce93d8"
  - type: impact
    target: target
    color: "#ce93d8"
  - type: shake
    target: target
    intensity: normal
  - type: damage_number
    target: target
    color: damage
