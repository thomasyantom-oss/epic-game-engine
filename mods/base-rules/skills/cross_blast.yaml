id: cross_blast
name: "十字爆裂"
description: "十字爆裂，以目标为中心十字范围爆炸"
category: skill
silenceable: true
targeting:
  aoe_offsets: [[0,0],[-1,0],[1,0],[0,-1],[0,1]]
  steps:
    - prompt: "选择目标"
      filter: enemy
      count: 1
animation:
  - type: pulse
    target: actor
    color: "#ffee58"
  - type: impact
    target: target
    color: "#ffee58"
  - type: shake
    target: target
    intensity: heavy
  - type: damage_number
    target: target
    color: damage
