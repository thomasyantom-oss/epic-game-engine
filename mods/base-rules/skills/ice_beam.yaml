id: ice_beam
name: "冰霜射线"
description: "冰霜射线，对目标造成冰系伤害"
category: skill
silenceable: true
targeting:
  steps:
    - prompt: "选择目标"
      filter: enemy
      count: 1
animation:
  - type: beam
    from: actor
    to: target
    color: "#81d4fa"
  - type: impact
    target: target
    color: "#81d4fa"
  - type: shake
    target: target
    intensity: normal
  - type: damage_number
    target: target
    color: damage
