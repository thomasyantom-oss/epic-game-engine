id: fireball
name: "火球术"
category: skill
silenceable: true
targeting:
  steps:
    - prompt: "选择目标"
      filter: enemy
      count: 1
animation:
  - type: projectile
    shape: circle
    color: "#ff4400"
    trail: glow
    speed: fast
    from: actor
    to: target
  - type: impact
    target: target
    color: "#ff4400"
  - type: shake
    target: target
    intensity: normal
  - type: damage_number
    target: target
    color: damage
