id: fireball
name: "火球术"
description: "对目标造成火焰魔法伤害，附带灼烧效果"
category: skill
tier: smooth
silenceable: true
effect: damage_with_debuff
damage:
  type: 法术
  add: 10
  scaling: { 智力: 0.2 }
level_scaling:
  "damage.add": 5
targeting:
  mode: pattern
  field: enemy
  pattern: [[0,0]]
  steps:
    - prompt: "选择目标"
      filter: enemy
      count: 1
debuff:
  id: burning
  scaling: { damage: { 智力: 0.1 } }
  data:
    damage: 3
    remaining: 2
    stacking: refresh
    source: "@caster"
    color: "#ff4400"
    permanent: false
    positive: false
log:
  template: "{caster} 的火球术命中 {target}，造成 {damage} 点伤害"
animation:
  - type: projectile
    shape: circle
    color: "#ff4400"
    trail: glow
    speed: fast
    from: actor
    to: target
  - type: impact
    target: target
    color: "#ff4400"
  - type: shake
    target: target
    intensity: normal
  - type: damage_number
    target: target
    color: damage
